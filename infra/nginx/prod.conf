# VPS-level reverse proxy for production.
# The Docker stack publishes prod on host port 8083; Nginx owns 80/443.
#
# Certificates: run certbot after the DNS record points at the VPS, for example:
#   sudo certbot --nginx -d example.com -d www.example.com
# Certbot rewrites the listen/ssl lines below automatically.
#
# Install: copy to /etc/nginx/sites-available/learnstack-prod.conf and symlink
# into /etc/nginx/sites-enabled/, then `sudo nginx -t && sudo systemctl reload nginx`.
server {
    listen 80;
    server_name example.com www.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name example.com www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
