# VPS-level reverse proxy for the dev environment.
# The Docker stack already publishes dev on host port 8081.
# Optional: this block gives dev a hostname instead of IP:8081.
#
# Install: copy to /etc/nginx/sites-available/learnstack-dev.conf and symlink
# into /etc/nginx/sites-enabled/, then `sudo nginx -t && sudo systemctl reload nginx`.
server {
    listen 80;
    server_name dev.example.com;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
