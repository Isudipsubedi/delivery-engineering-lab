# VPS-level reverse proxy for the staging environment.
# The Docker stack publishes staging on host port 8082.
#
# Install: copy to /etc/nginx/sites-available/learnstack-staging.conf and symlink
# into /etc/nginx/sites-enabled/, then `sudo nginx -t && sudo systemctl reload nginx`.
server {
    listen 80;
    server_name staging.example.com;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
