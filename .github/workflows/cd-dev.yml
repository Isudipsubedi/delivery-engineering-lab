name: CD - dev

on:
  push:
    branches: [dev]
    paths-ignore:
      - "docs/**"
      - "pipelineflow/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to dev
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: ${{ vars.APP_URL }}

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || 22 }}
          script_stop: true
          script: |
            cd /opt/delivery-engineering-lab/dev
            bash scripts/deploy.sh dev
